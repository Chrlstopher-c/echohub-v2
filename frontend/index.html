<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` : la page va jusque sous l'encoche, et `env(safe-area-inset-*)` (donc
         les classes .eh-marge-sure-*) devient renseigné. Ni `user-scalable=no` ni `maximum-scale` :
         empêcher le zoom est une régression d'accessibilité, pas une correction de mise en page. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Sombre par défaut, conformément à DESIGN.md : la couleur de fond du navigateur doit
         correspondre à --bg avant même que la feuille de styles soit chargée, sinon un flash
         blanc traverse le premier rendu. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0e0e11" />
    <title>EchoHub</title>
    <style>
      html {
        background: #0e0e11;
      }
    </style>
  </head>
  <body>
    <div id="racine"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
