# EchoHub v2 — orchestration locale.
#
# Cible : Windows 11 + Docker Desktop + WSL2. C'est ce qui détermine la syntaxe GPU ci-dessous,
# et elle est INVERSÉE d'une plateforme à l'autre (cf. COMPATIBILITE-GPU.md) :
#
#   Windows + Docker Desktop + WSL2 → deploy.resources.reservations.devices  (forme active ici)
#                                      `nvidia.com/gpu=all` échoue : "unresolvable CDI devices"
#   Linux natif avec CDI seul       → devices: ["nvidia.com/gpu=all"]
#                                      `--gpus all` échoue : "AMD CDI spec not found"
#
# Passer d'une machine à l'autre = permuter les deux blocs, rien d'autre.
name: echohub

services:
  echohub:
    build:
      context: .
      dockerfile: Dockerfile
    # Tag distinct de la v1 (`echohub:gpu`) : les deux images coexistent tant que la v2 n'est pas
    # validée de bout en bout. Elles se disputent en revanche les ports et le GPU — une seule à la fois.
    image: echohub:v2
    container_name: echohub-v2
    restart: unless-stopped

    # --- GPU : forme Windows/WSL2, inactive ici — cette machine est Linux natif (Arch), CDI ---
    # `--gpus all` (équivalent de la forme deploy.resources ci-dessous) échoue sur cette machine :
    # "AMD CDI spec not found" (COMPATIBILITE-GPU.md, confirmé MESURES-MOE.md 2026-08-15).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

    # --- GPU : forme Linux natif + CDI, ACTIVE sur cette machine ----------------------------
    devices:
      - nvidia.com/gpu=all

    # torch (vLLM) alloue en mémoire partagée. Le défaut Docker est de 64 Mo, insuffisant dès
    # qu'un worker démarre : l'échec se présente comme un plantage obscur, pas comme un manque
    # de place.
    shm_size: "2gb"

    ports:
      # Distincts de la v1 (37820/37821) : les deux versions peuvent tourner en même temps sur
      # le même hôte sans se disputer un port (mesuré : bind KO côté v2, servi par la v1).
      - "${ECHOHUB_PORT_WEB:-37920}:80"          # interface web (nginx)
      - "${ECHOHUB_PORT_API:-37921}:37921"       # API FastAPI directe, pour le débogage

    volumes:
      # Volumes nommés : MODELS_DIR et XDG_DATA_HOME pointent DEDANS (cf. Dockerfile). Tout ce
      # que le backend écrit ailleurs est perdu à la reconstruction de l'image.
      - echohub_models:/data/models              # modèles téléchargés (des dizaines de Go)
      # Lot L7 (MESURES-MOE.md) montait ici /mnt/models/echohub en lecture seule : c'est un chemin
      # de la machine Arch Linux, inexistant sous Windows — Docker Desktop créerait un dossier vide
      # et le registre de modèles se retrouverait sans rien. Le volume nommé reste la forme locale.
      # - /mnt/models/echohub:/data/models:ro
      - echohub_userdata:/data/user              # base SQLite, configuration, journaux

      # --- Développement : code monté depuis l'hôte, inactif par défaut -------------------
      # Décommenter pour éditer le backend sans reconstruire (`docker compose restart echohub`).
      # Le volume anonyme sur .venv est INDISSOCIABLE du bind mount : sans lui, un venv Windows
      # présent sur l'hôte masquerait le venv Linux de l'image, et le llama-cpp-python compilé
      # pour CUDA disparaîtrait purement et simplement.
      # - ./backend:/app/backend
      # - /app/backend/.venv

    environment:
      MODELS_DIR: /data/models
      XDG_DATA_HOME: /data/user
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HF_TOKEN: ${HF_TOKEN:-}
      # Authentification HTTP de l'interface, posée par docker/entrypoint.sh. Vides = aucune
      # authentification, comportement d'origine. Générer le couple avec docker/outils-acces.py :
      # le mot de passe n'existe qu'à l'écran, seul son empreinte crypt salée passe par ici.
      ECHOHUB_AUTH_USER: ${ECHOHUB_AUTH_USER:-}
      ECHOHUB_AUTH_HASH: ${ECHOHUB_AUTH_HASH:-}
      # Nom de service Docker, résolu par le DNS interne du réseau de la pile. Le domaine
      # `recherche` lit cette variable via backend/core/config.py — rien n'est codé en dur.
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      # GGML_CUDA_ENABLE_UNIFIED_MEMORY est volontairement ABSENTE : sous WSL2 elle immobilise
      # le modèle en RAM avec la VRAM figée à 2 Go (mesuré). ggml active le comportement sur la
      # simple présence de la variable — une valeur vide suffirait à nuire. L'entrypoint la
      # retire même si l'environnement hôte la transmet.

    healthcheck:
      # Interroge nginx, pas une route d'API : la page statique existe dès le premier démarrage,
      # ce qui donne un signal fiable sans dépendre de l'avancement du backend.
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # --- Recherche web, désormais active ------------------------------------------------------
  # Le profil `recherche-web` qui laissait ce service éteint a été retiré : il démarre avec la
  # pile. Toujours aucun port publié — `expose` ne l'ouvre que sur le réseau interne, où le
  # backend l'atteint sur http://searxng:8080. Rien n'est joignable depuis l'hôte ni l'extérieur.
  #
  # Pas de `depends_on` côté echohub, volontairement : le backend doit démarrer et servir même si
  # la recherche est indisponible. Son domaine `recherche` rend alors une erreur métier explicite
  # (503) et sa sonde /api/recherche/sante dit ce qui a été mesuré.
  searxng:
    image: searxng/searxng:latest
    container_name: echohub-searxng
    restart: unless-stopped
    volumes:
      # Le volume nommé reste monté sur tout /etc/searxng : l'image y écrit ce dont elle a besoin
      # (ownership, fichiers dérivés). Notre configuration est superposée PAR-DESSUS, en lecture
      # seule, sur le seul fichier qui nous intéresse — Docker applique les montages du chemin le
      # plus court au plus long, donc le fichier gagne sur le volume.
      # Sa présence empêche aussi l'entrypoint d'en régénérer un par défaut, dans lequel le format
      # JSON serait à nouveau désactivé.
      - echohub_searxng:/etc/searxng
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      # SearXNG refuse de démarrer sans clé. La valeur du fichier de configuration sert de repli ;
      # celle-ci prime lorsque l'image gère la variable. Enjeu faible : instance non publiée.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-echohub-v2-instance-locale-non-publiee}
      # Redondant avec settings.yml, et c'est le but : le limiteur rejette les appels
      # programmatiques et réclame un Valkey. Les deux voies de réglage doivent dire la même chose.
      SEARXNG_LIMITER: "false"
    expose:
      - "8080"

volumes:
  echohub_models:
  echohub_userdata:
  echohub_searxng:
