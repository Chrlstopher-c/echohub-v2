# EchoHub — reverse proxy web pour le conteneur.
# Sert le build statique du frontend (frontend/dist) et proxifie /api/* vers le backend
# FastAPI en interne (127.0.0.1:37821), en reproduisant le rewrite déjà fait par
# frontend/vite.config.ts en dev (`p.replace(/^\/api/, '')`) — aucune modification du
# code frontend n'a été nécessaire : frontend/src/api/base.ts retombe déjà sur `/api`
# en relatif dès qu'il détecte l'absence de window.__TAURI_INTERNALS__.
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Upgrade conditionnel : nécessaire pour le WebSocket /api/inference/chat/ws
    # (backend/routers/inference.py, route "/chat/ws") sans casser les requêtes HTTP normales
    # ni le SSE (EventSource) utilisé par plusieurs endpoints de streaming (/models/downloads/stream,
    # /settings/engines/install/*, /finetune/*/stream, etc.).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        root /app/frontend/dist;
        index index.html;

        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:37821;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # SSE et WebSocket ont besoin de flux non bufferisés et de délais longs
            # (une génération LLM peut durer plusieurs minutes).
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
