<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="352" viewBox="0 0 1040 352" fill="none" role="img">
  <defs><marker id="stp-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b929c"/></marker></defs>
  <rect width="1040" height="352" rx="16" fill="#0a0b0e" stroke="#20242c"/>
  <text x="30" y="36" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12" letter-spacing="2.5" fill="#8b929c">RUN IT</text>
  <rect x="30" y="56" width="478" height="124" rx="12" fill="#161b22" stroke="#2a313c"/>
  <circle cx="56" cy="82" r="13" fill="#d8a35f"/>
  <text x="56" y="87" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="13" font-weight="700" fill="#0a0b0e">1</text>
  <text x="78" y="87" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#f4f1ea">Have a GPU and Docker</text>
  
  <text x="44" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">NVIDIA with CUDA 12.8 or newer. Driver 570+ for an RTX 50xx. The image is</text><text x="44" y="131" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">built on the CUDA devel base because llama-cpp-python is compiled at build</text><text x="44" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">time, not downloaded.</text><path d="M512 82 l16 0" stroke="#8b929c" stroke-width="1.4" marker-end="url(#stp-dark)"/>
  <rect x="532" y="56" width="478" height="124" rx="12" fill="#161b22" stroke="#2a313c"/>
  <circle cx="558" cy="82" r="13" fill="#d8a35f"/>
  <text x="558" y="87" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="13" font-weight="700" fill="#0a0b0e">2</text>
  <text x="580" y="87" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#f4f1ea">Set the two things that matter</text>
  <rect x="546" y="108" width="450" height="24" rx="6" fill="#0a0b0e" stroke="#20242c"/>
    <text x="556" y="124" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11.5" fill="#d8a35f">cp .env.example .env</text>
  <text x="546" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">ATELIER_JETON must hold a random secret: empty means the model is refused</text><text x="546" y="165" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">any code execution. Never set GGML_CUDA_ENABLE_UNIFIED_MEMORY.</text>
  <rect x="30" y="204" width="478" height="124" rx="12" fill="#161b22" stroke="#2a313c"/>
  <circle cx="56" cy="230" r="13" fill="#d8a35f"/>
  <text x="56" y="235" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="13" font-weight="700" fill="#0a0b0e">3</text>
  <text x="78" y="235" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#f4f1ea">Bring the stack up</text>
  <rect x="44" y="256" width="450" height="24" rx="6" fill="#0a0b0e" stroke="#20242c"/>
    <text x="54" y="272" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11.5" fill="#d8a35f">docker compose up -d</text>
  <text x="44" y="298" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">API, nginx, SearXNG and the execution workshop. Only the web port is</text><text x="44" y="313" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">published; the rest talk on the internal network.</text><path d="M512 230 l16 0" stroke="#8b929c" stroke-width="1.4" marker-end="url(#stp-dark)"/>
  <rect x="532" y="204" width="478" height="124" rx="12" fill="#161b22" stroke="#2a313c"/>
  <circle cx="558" cy="230" r="13" fill="#d8a35f"/>
  <text x="558" y="235" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="13" font-weight="700" fill="#0a0b0e">4</text>
  <text x="580" y="235" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#f4f1ea">Open it</text>
  <rect x="546" y="256" width="450" height="24" rx="6" fill="#0a0b0e" stroke="#20242c"/>
    <text x="556" y="272" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11.5" fill="#d8a35f">http://localhost:37920</text>
  <text x="546" y="298" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">Search a model, download it, load it. For UI work without compiling CUDA,</text><text x="546" y="313" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">./start.sh runs uvicorn and Vite natively instead.</text>
</svg>