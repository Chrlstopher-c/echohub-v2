<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="232" viewBox="0 0 1040 232" fill="none" role="img">
  <rect width="1040" height="232" rx="16" fill="#0a0b0e" stroke="#20242c"/>
  <text x="30" y="36" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12" letter-spacing="2.5" fill="#8b929c">WHAT IT STANDS ON</text>
  <rect x="30" y="56" width="313.3333333333333" height="152" rx="12" fill="#161b22" stroke="#2a313c"/>
  <text x="48" y="106" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="600" fill="#f4f1ea">CUDA 12.8</text>
  <text x="48" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#c3cad3">the devel image, because llama-cpp-python is</text><text x="48" y="149" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#c3cad3">compiled here rather than downloaded</text>
  <text x="48" y="172" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#8b929c">a runtime image cannot build it</text>
  <rect x="363.3333333333333" y="56" width="313.3333333333333" height="152" rx="12" fill="#161b22" stroke="#2a313c"/>
  <text x="381.3333333333333" y="106" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="600" fill="#f4f1ea">2 engines</text>
  <text x="381.3333333333333" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#c3cad3">llama.cpp through its native server, and vLLM</text><text x="381.3333333333333" y="149" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#c3cad3">in a versioned venv</text>
  <text x="381.3333333333333" y="172" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#8b929c">one model loaded at a time, under a</text><text x="381.3333333333333" y="187" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#8b929c">supervisor</text>
  <rect x="696.6666666666666" y="56" width="313.3333333333333" height="152" rx="12" fill="#161b22" stroke="#2a313c"/>
  <text x="714.6666666666666" y="106" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="600" fill="#f4f1ea">188 / 197<tspan font-size="16" fill="#8b929c"> files</tspan></text>
  <text x="714.6666666666666" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#c3cad3">Python and TypeScript, 31 756 lines on the</text><text x="714.6666666666666" y="149" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#c3cad3">backend alone</text>
  <text x="714.6666666666666" y="172" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#8b929c">FastAPI and React 18, strict TypeScript</text>
