  <text x="48" y="106" font-family="Georgia,'Times New Roman',serif" font-size="38" font-weight="600" fill="#1f2328">41<tspan font-size="16" fill="#59636e"> vs 80</tspan></text>
  <text x="48" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#3b4149">layers really in the GGUF,</text><text x="48" y="149" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#3b4149">against 80 guessed from the name</text>
  <text x="48" y="172" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#59636e">Qwen3.6-35B-A3B,</text><text x="48" y="187" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#59636e">COMPATIBILITE-GPU.md</text>
  <rect x="280" y="56" width="230" height="152" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="298" y="106" font-family="Georgia,'Times New Roman',serif" font-size="38" font-weight="600" fill="#1f2328">436<tspan font-size="16" fill="#59636e"> MB</tspan></text>
  <text x="298" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#3b4149">real weight per layer, against</text><text x="298" y="149" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#3b4149">the 150 MB the v1 assumed</text>
  <text x="298" y="172" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#59636e">same model, read from the file</text>
  <rect x="530" y="56" width="230" height="152" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="548" y="106" font-family="Georgia,'Times New Roman',serif" font-size="38" font-weight="600" fill="#1f2328">12<tspan font-size="16" fill="#59636e"> s</tspan></text>
  <text x="548" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#3b4149">to load, against minutes with</text><text x="548" y="149" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#3b4149">VRAM stuck at 2 GB</text>
  <text x="548" y="172" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#59636e">WSL2, RTX 5080, then 19.6 tok/s</text>
  <rect x="780" y="56" width="230" height="152" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="798" y="106" font-family="Georgia,'Times New Roman',serif" font-size="38" font-weight="600" fill="#1f2328">442</text>
  <text x="798" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#3b4149">Python test functions, none of</text><text x="798" y="149" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#3b4149">them needing a GPU or a network</text>
  <text x="798" y="172" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#59636e">the planner is pure, so a</text><text x="798" y="187" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#59636e">budget can be injected</text>
