# EchoHub v2 — reverse proxy web du conteneur.
# Sert le build statique du frontend et proxifie /api vers FastAPI en retirant le préfixe.

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Journaux vers la sortie standard : `docker compose logs` devient la seule source à lire.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Une requête proxifiée peut porter un fichier (import de conversation, contexte). 64 Mo
    # évite un 413 opaque côté client ; les modèles, eux, sont téléchargés par le backend.
    client_max_body_size 64m;

    # Upgrade conditionnel : nécessaire au WebSocket de génération sans casser les requêtes
    # HTTP normales ni le SSE des flux de progression (téléchargement, installation de moteur).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream echohub_backend {
        server 127.0.0.1:37821;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        root /app/frontend/dist;
        index index.html;

        location /api/ {
            # Le backend expose ses routes sans préfixe : /api/models/... → /models/...
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://echohub_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # SSE et WebSocket exigent un flux non bufferisé et des délais longs : une
            # génération, un téléchargement de modèle ou une compilation de moteur durent des
            # minutes. Avec le buffering actif, le client ne reçoit rien avant la fin.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Les assets sont servis avec une empreinte de version (?v=…) posée par l'entrypoint :
        # on peut donc les mettre en cache long sans risque. Sans empreinte, un déploiement
        # front resterait invisible derrière le cache du navigateur, rechargement compris.
        location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|webp|avif)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # index.html porte les empreintes : il ne doit jamais être mis en cache, sinon le
        # navigateur continue de réclamer les anciennes versions des assets.
        location = /index.html {
            add_header Cache-Control "no-store";
        }

        # Routage côté client (SPA) : toute URL inconnue retombe sur index.html.
        location / {
            try_files $uri /index.html;
        }
    }
}
